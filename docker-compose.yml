# Local: docker compose up --build
# Dokploy (Compose): use this file; add a domain on `app` for HTTPS.
# Dokploy (app + managed Postgres): deploy Dockerfile only, set DATABASE_URL to the
# internal URL, and add a domain so the app joins dokploy-network.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-kusi}:${POSTGRES_PASSWORD:-kusi}@db:5432/${POSTGRES_DB:-kusi}?schema=public
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kusi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kusi}
      POSTGRES_DB: ${POSTGRES_DB:-kusi}
    volumes:
      - kusi-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kusi} -d ${POSTGRES_DB:-kusi}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kusi-db:
