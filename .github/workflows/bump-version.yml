name: Bump version on main

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-version:
    if: >-
      github.event.head_commit != null &&
      !contains(github.event.head_commit.message, '[skip version]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Bumps the minor version (0.1.0 -> 0.2.0 -> ... -> 0.9.0 -> 1.0.0),
      # i.e. +0.1 on the displayed version number.
      - name: Bump minor version by 0.1
        run: npm version minor --no-git-tag-version

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          NEW_VERSION="$(node -p "require('./package.json').version")"
          git add package.json package-lock.json
          git commit -m "chore: bump version to v${NEW_VERSION} [skip version]"
          git push origin HEAD:main
